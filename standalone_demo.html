<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Twin - Water Reticulation System</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8F0F8;--bg2:#F4F8FC;--bg3:#FFFFFF;--bg4:#F4F8FC;--bd:rgba(17,113,184,0.12);--bd2:rgba(17,113,184,0.15);--t1:#062C60;--t2:#163F56;--t3:#7A9AB5;--bl:#1171b8;--gn:#34C759;--rd:#FF3B30;--or:#FF9500;--pu:#AF52DE;--cy:#1A8AD4;--yw:#FFD60A}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Aktiv Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Helvetica Neue',sans-serif;background:var(--bg);background-image:url('https://static.prod-images.emergentagent.com/jobs/08778319-680e-4dcc-9637-79a56dea1c9a/images/051e0fd6187a51fc4b81cd9d57090552be0cc3fe87c259ce9d1761adead4fc4f.jpeg');background-size:cover;background-attachment:fixed;background-position:center;color:var(--t1);min-height:100vh}
.chivo{font-family:'Chivo',sans-serif}.mono{font-family:'JetBrains Mono',monospace}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 32px;border-bottom:1px solid var(--bd);background:var(--bg);background-image:url('https://static.prod-images.emergentagent.com/jobs/08778319-680e-4dcc-9637-79a56dea1c9a/images/051e0fd6187a51fc4b81cd9d57090552be0cc3fe87c259ce9d1761adead4fc4f.jpeg');background-size:cover;background-attachment:fixed;background-position:center;position:sticky;top:0;z-index:50}
.header-left{display:flex;align-items:center;gap:12px;width:180px}.header-center{text-align:center;flex:1}.header-right{display:flex;align-items:center;justify-content:flex-end;width:180px}
.header-center h1{color:#062C60;font-family:'Chivo',sans-serif;font-size:22px;font-weight:900;letter-spacing:-0.5px}.header-center p{font-size:11px;color:#1171b8;letter-spacing:1px;text-transform:uppercase}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--gn);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes pulseBorder{0%,100%{border-color:#FF3B30}50%{border-color:#FF3B3055}}
.main{padding:24px 32px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:24px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px}
.gm{display:grid;grid-template-columns:3fr 1fr;gap:16px;margin-bottom:16px}
.mc{background:var(--bg3);border:1px solid var(--bd);padding:20px 24px}.mc .lb{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#163F56;margin-bottom:8px}
.mc .vl{font-family:'Chivo',sans-serif;font-size:42px;font-weight:900;letter-spacing:-2px;line-height:1;color:#062C60}.mc .un{font-size:14px;color:#7A9AB5;font-weight:400;margin-left:4px}
.pn{background:var(--bg2);border:1px solid var(--bd);padding:20px 24px;margin-bottom:16px}
.pd{background:var(--bg4);border:1px solid var(--bd);padding:16px 20px;border-radius:2px;margin-bottom:16px}
.st{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--t2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.st .dot{width:6px;height:6px;border-radius:50%}
.tabs{display:flex;align-items:center;border:1px solid var(--bd2);background:var(--bg3);border-radius:2px;overflow:hidden;flex-wrap:wrap}
.tb{display:flex;align-items:center;gap:4px;padding:8px 12px;font-size:10px;font-weight:700;border:none;cursor:pointer;transition:all .2s;background:transparent;color:var(--t2)}
.tb.ac{background:var(--bl);color:#062C60}.tb:hover:not(.ac){color:#062C60}
.th{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.tv{display:none}.tv.ac{display:block}
.lb2{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--rd);border-radius:2px;animation:pulseBorder 2s infinite}
.lb2 span{font-size:11px;font-weight:700;color:var(--rd)}
/* Balance cards */
.bc{padding:12px;border-radius:2px;border:1px solid;background:var(--bg3)}.bc .bl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--t2);margin-bottom:6px}
.bc .bv{font-family:'Chivo',sans-serif;font-size:24px;font-weight:900;letter-spacing:-1px}.bc .bu{font-size:10px;color:var(--t3)}.bc .bs{font-size:9px;color:var(--t3);margin-top:4px}
/* Flow */
.fr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:20px;padding:0 20px;overflow-x:auto}
.fn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px;border-radius:2px;border:1px solid;min-width:110px;text-align:center}
.fn .fl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t2);margin-bottom:4px}
.fn .fv{font-family:'Chivo',sans-serif;font-size:20px;font-weight:900;letter-spacing:-1px}.fn .fu{font-size:9px;color:var(--t3)}
.fa{color:var(--t3);font-size:18px}
.di{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:var(--bg);background-image:url('https://static.prod-images.emergentagent.com/jobs/08778319-680e-4dcc-9637-79a56dea1c9a/images/051e0fd6187a51fc4b81cd9d57090552be0cc3fe87c259ce9d1761adead4fc4f.jpeg');background-size:cover;background-attachment:fixed;background-position:center;border-radius:2px;margin-bottom:4px}
.di .dl{font-size:10px;color:var(--t2);flex:1}.di .dv{font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.gi .gh{display:flex;justify-content:space-between;margin-bottom:4px}.gi .gl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t2)}
.gi .gv{font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace}
.gb{height:6px;background:#E0E8F0;border-radius:3px;overflow:hidden}.gf{height:100%;border-radius:3px;transition:width .7s ease}
.ab{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:2px;border:1px solid;margin-bottom:8px;font-size:11px}
.dt{width:100%;font-size:10px;border-collapse:collapse}.dt th{text-align:left;padding:8px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bd)}
.dt td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.03)}.dt .nm{font-weight:700;color:#062C60}.dt .sb{font-size:9px;color:var(--t3)}
.bd{padding:2px 6px;border-radius:2px;font-size:9px;font-weight:700;text-transform:uppercase}
/* AI Panel */
.ai{background:var(--bg);background-image:url('https://static.prod-images.emergentagent.com/jobs/08778319-680e-4dcc-9637-79a56dea1c9a/images/051e0fd6187a51fc4b81cd9d57090552be0cc3fe87c259ce9d1761adead4fc4f.jpeg');background-size:cover;background-attachment:fixed;background-position:center;border:1px solid rgba(0,122,255,0.5);padding:20px;min-height:500px;max-height:500px;display:flex;flex-direction:column}
.ai h3{font-family:'Chivo',sans-serif;font-size:18px;font-weight:700;color:#062C60;margin-bottom:4px}.ai .as{font-size:11px;color:var(--t2);margin-bottom:16px}
.sq{width:100%;text-align:left;font-size:11px;padding:8px;border:1px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer;margin-bottom:6px;border-radius:2px}
.sq:hover{border-color:var(--bl)}
.air{display:flex;gap:8px;margin-top:auto}.air input{flex:1;padding:8px 12px;font-size:12px;border:1px solid var(--bd2);background:var(--bg2);color:#062C60;font-family:'JetBrains Mono',monospace;border-radius:2px;outline:none}
.air input:focus{border-color:var(--bl)}.air button{padding:8px 16px;background:var(--bl);color:#062C60;border:none;cursor:pointer;border-radius:2px;font-weight:700}
/* PFD - Isometric 3D */
.iso-scene{position:relative;width:100%;min-height:640px;background:linear-gradient(160deg,#E8F0F8 0%,#D4E6F5 40%,#C0D8EC 100%);border:1px solid rgba(255,255,255,0.06);border-radius:2px;overflow:hidden}
.iso-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,122,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,122,255,0.03) 1px,transparent 1px);background-size:50px 50px;mask-image:radial-gradient(ellipse at center,black 40%,transparent 80%)}
.iso-zones{position:absolute;inset:0;z-index:0;pointer-events:none}
.iso-zlbl{position:absolute;font-size:11px;font-weight:900;font-family:'JetBrains Mono',monospace;letter-spacing:3px;white-space:nowrap;user-select:none}
.iso-pipes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.iso-pipe-flow{animation:pipeFlow 2s linear infinite}
@keyframes pipeFlow{0%{stroke-dashoffset:48}100%{stroke-dashoffset:0}}
.iso-layer{position:absolute;inset:0;z-index:2}.iso-layer-inst{position:absolute;inset:0;z-index:3;pointer-events:none}
.iso-inst{pointer-events:auto}
.iso-tank{position:absolute;cursor:pointer;transition:transform .2s ease,filter .2s ease;transform-origin:center bottom}
.iso-tank:hover{transform:scale(1.06) translateY(-4px);filter:brightness(1.25);z-index:50 !important}
.iso-tank-cap{width:100%;height:18px;border:1px solid;border-radius:50%;background:linear-gradient(135deg,rgba(17,113,184,0.15),rgba(17,113,184,0.05));position:relative;z-index:3;backdrop-filter:blur(2px)}
.iso-tank-body{position:relative;width:100%;border:1px solid;border-top:none;background:linear-gradient(180deg,rgba(6,44,96,0.88),rgba(6,44,96,0.95));box-shadow:0 4px 16px rgba(6,44,96,0.2);overflow:hidden;z-index:2;border-radius:0 0 4px 4px}
.iso-tank-water{position:absolute;bottom:0;left:0;right:0;transition:height 1.5s cubic-bezier(0.4,0,0.2,1);border-radius:0 0 3px 3px}
.iso-water-shimmer{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.08) 30%,rgba(255,255,255,0.12) 50%,rgba(255,255,255,0.08) 70%,transparent 100%);animation:shimmer 3s ease-in-out infinite}
@keyframes shimmer{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
.iso-tank-level{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:5;pointer-events:none}
.iso-lv{display:block;font-family:'Chivo',sans-serif;font-size:18px;font-weight:900;letter-spacing:-1px;color:#062C60;text-shadow:0 1px 4px rgba(0,0,0,0.8)}
.iso-lu{display:block;font-size:9px;color:rgba(255,255,255,0.5);font-family:'JetBrains Mono',monospace}
.iso-tank-base{width:100%;height:10px;border:1px solid;border-top:none;border-radius:0 0 50% 50%;background:rgba(0,0,0,0.3);position:relative;z-index:1}
.iso-tank-lbl{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;font-size:9px;font-weight:600;color:#163F56;text-align:center;white-space:nowrap}
.iso-sdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.iso-tank-id{text-align:center;font-size:8px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:0.5px;margin-top:2px}
.iso-inst{position:absolute;cursor:pointer;transition:transform .15s ease}.iso-inst:hover{transform:scale(1.18);z-index:50 !important}
.iso-inst-in{display:flex;align-items:center;gap:3px;padding:3px 7px;border-radius:2px;border:1px solid;background:rgba(255,255,255,0.88);box-shadow:0 1px 4px rgba(6,44,96,0.1);backdrop-filter:blur(6px);white-space:nowrap}
.iso-inst-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.iso-inst-lbl{font-size:8px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:0.5px}
.iso-inst-val{font-size:8px;color:#163F56;font-family:'JetBrains Mono',monospace}
.iso-legend{position:absolute;top:12px;right:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;z-index:10;padding:6px 10px;background:rgba(255,255,255,0.85);box-shadow:0 2px 8px rgba(6,44,96,0.08);backdrop-filter:blur(8px);border-radius:2px;border:1px solid rgba(255,255,255,0.06)}
.iso-legend-item{display:flex;align-items:center;gap:4px;font-size:9px;color:#163F56;font-family:'JetBrains Mono',monospace}
.iso-legend-dot{width:6px;height:6px;border-radius:50%}
.iso-legend-sep{width:1px;height:14px;background:rgba(255,255,255,0.1)}
.iso-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:#7A9AB5;z-index:10}
@media(max-width:1200px){.iso-scene{min-height:520px}.iso-layer,.iso-layer-inst,.iso-zones{transform:scale(0.85);transform-origin:top left}}
@media(max-width:768px){.iso-scene{min-height:420px;overflow-x:auto}.iso-layer,.iso-layer-inst,.iso-zones{transform:scale(0.6);transform-origin:top left}}
/* Sensor Grid */
.sg{background:var(--bg2);border:1px solid var(--bd);padding:20px 24px;margin-bottom:16px}
.sg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-height:256px;overflow-y:auto}
.sc{padding:12px;border:1px solid var(--bd2);background:var(--bg3);border-radius:2px;cursor:pointer;transition:border-color .2s}
.sc:hover{border-color:var(--bl)}
/* Anomaly */
.ap{background:var(--bg2);border:1px solid var(--bd);padding:20px 24px;margin-bottom:16px}
.ai-item{padding:12px;border-left:2px solid var(--or);background:rgba(255,149,0,.05);border-radius:2px;margin-bottom:8px}
/* Alerts */
.af{background:var(--bg2);border:1px solid var(--bd);padding:20px 24px;margin-bottom:16px}
.al-item{padding:12px;border:1px solid;border-radius:2px;display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
/* Compliance */
.ce{background:var(--bg2);border:1px solid var(--bd);padding:20px 24px;margin-bottom:16px}
/* Analytics view */
.analytics-view{background:var(--bg2);border:1px solid var(--bd);padding:24px;margin-bottom:16px}
.back-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;background:transparent;border:1px solid var(--bd2);color:var(--t2);font-size:12px;cursor:pointer;border-radius:2px;margin-bottom:16px;font-weight:600}
.back-btn:hover{border-color:var(--bl);color:var(--bl)}
/* Tooltip */
.tooltip{position:absolute;z-index:20;padding:12px;border-radius:2px;border:1px solid;background:#FFFFFFEE;pointer-events:none;min-width:240px}
/* Heatmap */
.hm{display:flex;flex-direction:column;gap:2px}.hmr{display:flex;align-items:center;gap:2px}.hml{width:28px;font-size:8px;color:var(--t2)}
.hmc{width:16px;height:14px;border-radius:1px}
/* Quality */
.qc{padding:12px;border-radius:2px;border:1px solid;background:var(--bg3)}
.qc .rb{position:relative;height:6px;background:#E0E8F0;border-radius:3px;margin-top:8px}
.qc .rok{position:absolute;height:100%;background:rgba(52,199,89,.2);border-radius:3px}
.qc .rdot{position:absolute;width:8px;height:8px;border-radius:50%;top:-1px;transform:translateX(-50%)}
.zc{padding:10px;border-radius:2px;border:1px solid;background:var(--bg2);margin-bottom:8px}
.zg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;font-size:10px}
.ev{display:flex;align-items:flex-start;gap:8px;padding:8px;background:var(--bg2);border-radius:2px;margin-bottom:4px}
.ed{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.pc{padding:10px;background:var(--bg2);border-radius:2px;margin-bottom:8px}
.sbn{display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:2px;border:1px solid;margin-bottom:16px}
.mi{padding:10px;border-radius:2px;border:1px solid;background:var(--bg2);margin-bottom:8px}
/* Range buttons */
.rng{display:flex;align-items:center;border:1px solid var(--bd2);background:var(--bg3);border-radius:2px;overflow:hidden}
.rng button{padding:6px 12px;font-size:10px;font-weight:700;border:none;cursor:pointer;background:transparent;color:var(--t2);transition:all .2s}
.rng button.ac{background:var(--bl);color:#062C60}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg);background-image:url('https://static.prod-images.emergentagent.com/jobs/08778319-680e-4dcc-9637-79a56dea1c9a/images/051e0fd6187a51fc4b81cd9d57090552be0cc3fe87c259ce9d1761adead4fc4f.jpeg');background-size:cover;background-attachment:fixed;background-position:center}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
@media(max-width:1024px){.g4,.g6,.gr{grid-template-columns:repeat(2,1fr)}.gm{grid-template-columns:1fr}.g3,.g2{grid-template-columns:1fr}.fr{flex-wrap:wrap;justify-content:center}}
@media(max-width:640px){.main{padding:12px 16px}.header{padding:8px 16px}.g4,.g6,.gr{grid-template-columns:1fr}.mc .vl{font-size:28px}}
</style>
</head>
<body>
<header class="header">
  <div class="header-left">
    <img src="https://customer-assets.emergentagent.com/job_08778319-680e-4dcc-9637-79a56dea1c9a/artifacts/hxpepcrm_image.png" alt="Talbot" style="height:44px" onerror="this.outerHTML='<div style=\'padding:6px 12px;border:2px solid var(--bl);font-family:Chivo,sans-serif;font-weight:900;font-size:18px\'>TALBOT</div>'">
    <div style="display:flex;align-items:center;gap:6px"><div class="live-dot"></div><span style="font-size:11px;color:var(--gn)">Live</span></div>
  </div>
  <div class="header-center"><h1 class="chivo">Digital Twin</h1><p>Water Reticulation System</p></div>
  <div class="header-right">
  </div>
</header>
<main class="main">
  <div class="g4" id="metricsRow"></div>
  <div id="mainDashboard">
    <div class="gm">
      <div>
        <div class="pn" style="padding:16px 20px">
          <div class="th"><div class="tabs" id="mainTabs"></div><div class="lb2"><span>&#9679; 6 LEAKS DETECTED</span></div></div>
          <div id="view-pfd" class="tv ac"></div>
          <div id="view-plant" class="tv"></div>
          <div id="view-balance" class="tv"></div>
          <div id="view-nrw" class="tv"></div>
          <div id="view-demand" class="tv"></div>
          <div id="view-assets" class="tv"></div>
          <div id="view-quality" class="tv"></div>
        </div>
        <div class="g2">
          <div id="sensorGrid"></div>
          <div id="anomalyPanel"></div>
        </div>
        <div id="alertsFeed"></div>
        <div id="complianceExport"></div>
      </div>
      <div><div class="ai" id="aiPanel"></div></div>
    </div>
  </div>
  <div id="analyticsView" style="display:none"></div>
</main>
<script>
const R=(a,b)=>Math.round((Math.random()*(b-a)+a)*100)/100;
const RI=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const PK=a=>a[RI(0,a.length-1)];
const CL=(v,l,h)=>Math.min(h,Math.max(l,v));
const FD=d=>{const dt=new Date(d);return `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}:${String(dt.getSeconds()).padStart(2,'0')}`};

// Instrument definitions
const INSTRUMENTS=[
{id:'FIT_10',name:'Municipal Intake Flow',type:'flow',unit:'L/min',baseline:150,x:'15%',y:'37%',label:'FIT 10'},
{id:'FIT_FL',name:'Fire Line Flow',type:'flow',unit:'L/min',baseline:80,x:'38%',y:'17%',label:'FIT'},
{id:'FIT_8',name:'Nano Recovery 2 Flow',type:'flow',unit:'L/min',baseline:65,x:'47%',y:'68%',label:'FIT 8'},
{id:'FIT_6',name:'Nano Recovery 1 Flow',type:'flow',unit:'L/min',baseline:70,x:'30%',y:'72%',label:'FIT 6'},
{id:'FIT_CIP',name:'CIP Line Flow',type:'flow',unit:'L/min',baseline:45,x:'83%',y:'37%',label:'FIT'},
{id:'LIT_MR',name:'Main Reservoir Level',type:'level',unit:'%',baseline:72,x:'8%',y:'8%',label:'LIT'},
{id:'LIT_RT4',name:'Reservoir Tank 4 Level',type:'level',unit:'%',baseline:65,x:'50%',y:'8%',label:'LIT'},
{id:'LIT_RR2',name:'RO Recovery Tank 2',type:'level',unit:'%',baseline:58,x:'22%',y:'24%',label:'LIT'},
{id:'LIT_STW',name:'Semi-Treated Water Tank',type:'level',unit:'%',baseline:80,x:'38%',y:'30%',label:'LIT'},

function genSensors(){return INSTRUMENTS.map(inst=>{
  const v=inst.type==='flow'?R(inst.baseline*.8,inst.baseline*1.2):inst.type==='level'?R(inst.baseline-10,inst.baseline+10):inst.type==='pressure'?R(inst.baseline*.9,inst.baseline*1.1):inst.type==='ph'?R(inst.baseline-.3,inst.baseline+.3):inst.type==='chlorine'?R(inst.baseline-.15,inst.baseline+.15):R(inst.baseline-50,inst.baseline+50);
  const s=Math.random()>.92?'offline':Math.random()>.85?'warning':'online';
  return {...inst,value:Math.round(v*100)/100,status:s};
})}
function genAlerts(){
  const types=['compliance','leak','anomaly','offline'];const sevs=['critical','warning','info'];
  return Array.from({length:RI(4,8)},(_,i)=>({id:`ALT_${i}`,type:PK(types),severity:PK(sevs),message:PK(['pH exceeding upper threshold on RO feed','Flow deviation detected on CIP main','Pressure drop below normal on RACF 2','Conductivity spike on nano filtration output','Level critically low in backwash recovery tank','Chlorine residual below minimum requirement']),instrument_name:PK(INSTRUMENTS).name,timestamp:new Date(Date.now()-RI(60,7200)*1000).toISOString()}));
}
function genAnomalies(){
  return Array.from({length:RI(3,6)},(_,i)=>{const inst=PK(INSTRUMENTS);return{id:`ANM_${i}`,anomaly_type:PK(['flow_deviation','pressure_spike','level_drop','quality_drift']),instrument_name:inst.name,description:`Unusual pattern detected on ${inst.id}: ${PK(['Sudden drop','Gradual increase','Oscillation','Flat-line'])} outside normal operating envelope`,confidence:R(.65,.98),timestamp:new Date(Date.now()-RI(300,14400)*1000).toISOString()};});
}
function genTimeSeries(inst,hours=24){
  const now=Date.now();const pts=hours*6;const ts=[];const vals=[];const ra5=[];const ra10=[];
  for(let i=0;i<pts;i++){ts.push(new Date(now-(pts-i)*600000).toISOString());const v=inst.baseline+R(-inst.baseline*.15,inst.baseline*.15);vals.push(Math.round(v*100)/100);
    const s5=vals.slice(Math.max(0,vals.length-5)).reduce((a,b)=>a+b,0)/Math.min(5,vals.length);ra5.push(Math.round(s5*100)/100);
    const s10=vals.slice(Math.max(0,vals.length-10)).reduce((a,b)=>a+b,0)/Math.min(10,vals.length);ra10.push(Math.round(s10*100)/100);
  }
  const mn=Math.min(...vals),mx=Math.max(...vals),avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  return{timestamps:ts,values:vals,rolling_avg_5:ra5,rolling_avg_10:ra10,stats:{current:vals[vals.length-1],mean:Math.round(avg*100)/100,min:Math.round(mn*100)/100,max:Math.round(mx*100)/100,std_dev:Math.round(Math.sqrt(vals.reduce((s,v)=>s+(v-avg)**2,0)/vals.length)*100)/100,data_points:pts}};
}

function renderPFD(){

    tanksHtml+=`<div class="iso-tank" style="left:${t.x*100}px;top:${t.y*110}px;width:${t.w*90}px;z-index:${Math.round(t.y*10)}" onclick="openAnalytics('${t.id}')">

// ── Alerts Feed ──
function renderAlerts(){
  const sc={critical:{c:'#FF3B30',bg:'rgba(255,59,48,.1)',i:'&#10006;'},warning:{c:'#FF9500',bg:'rgba(255,149,0,.1)',i:'&#9888;'},info:{c:'#1A8AD4',bg:'rgba(50,173,230,.1)',i:'&#8505;'}};
  document.getElementById('alertsFeed').innerHTML=`<div class="af"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 class="chivo" style="font-size:20px;font-weight:700">Active Alerts</h3><span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--t2)">${alerts.length} Active</span></div><div style="max-height:384px;overflow-y:auto">${alerts.map(a=>{const cfg=sc[a.severity]||sc.info;return`<div class="al-item" style="background:${cfg.bg};border-color:${cfg.c}"><span style="font-size:20px;color:${cfg.c}">${cfg.i}</span><div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><div><span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:${cfg.c}">${a.type}</span><span style="font-size:10px;color:var(--t2);margin-left:8px">${a.instrument_name}</span></div><span style="font-size:10px;color:var(--t2)">${FD(a.timestamp)}</span></div><p style="font-size:12px;color:#062C60;margin-bottom:8px">${a.message}</p><button style="font-size:10px;padding:4px 12px;background:var(--bl);color:#062C60;border:none;cursor:pointer;border-radius:2px;font-weight:600" onclick="this.parentElement.parentElement.remove()">Acknowledge</button></div></div>`}).join('')}</div></div>`;
}

      {f:[670,106],t:[740,38],v:cip,c:'#34C759'},{f:[670,106],t:[740,82],v:pet,c:'#34C759'},{f:[670,106],t:[740,126],v:can,c:'#34C759'},{f:[670,106],t:[740,170],v:syr,c:'#34C759'},{f:[670,106],t:[740,218],v:ww,c:'#FF9500'},
      {f:[440,210],t:[440,132],v:rec,c:'#AF52DE'},{f:[620,132],t:[620,228],v:evap,c:'#FF9500'},{f:[620,132],t:[620,278],v:seep,c:'#FF3B30'}

      return`<path d="${d}" fill="none" stroke="${p.c}25" stroke-width="8"/><path d="${d}" fill="none" stroke="${p.c}" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arw)" opacity=".7"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="2s" repeatCount="indefinite"/></path><text fill="${p.c}" font-size="7" font-weight="700" font-family="JetBrains Mono,monospace" text-anchor="middle"><textPath href="#fp${i}" startOffset="50%">${p.v}</textPath></text><path id="fp${i}" d="${d}" fill="none" stroke="none"/>`;}).join('')}
    ${[{l:'Municipal\\nSupply',x:30,y:50,w:90,h:44,c:'#1171b8'},{l:'Rainfall\\n/Runoff',x:30,y:110,w:90,h:44,c:'#1A8AD4'},{l:'Borehole\\nSupply',x:30,y:170,w:90,h:44,c:'#1171b8'},

      {l:'CIP Lines',x:740,y:20,w:80,h:36,c:'#34C759'},{l:'PET Lines',x:740,y:64,w:80,h:36,c:'#34C759'},{l:'Canline',x:740,y:108,w:80,h:36,c:'#34C759'},{l:'Syrup Room',x:740,y:152,w:80,h:36,c:'#34C759'},{l:'WWTP',x:740,y:200,w:80,h:36,c:'#FF9500'},
      {l:'Recovery\\nSystem',x:390,y:210,w:100,h:44,c:'#AF52DE'},{l:'Evaporation',x:570,y:210,w:80,h:36,c:'#FF9500'},{l:'Seepage',x:570,y:260,w:80,h:36,c:'#FF3B30'}
    ].map(n=>`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="3" fill="${n.c}12" stroke="${n.c}55" stroke-width="1"/>${n.l.split('\\n').map((ln,li,arr)=>`<text x="${n.x+n.w/2}" y="${n.y+n.h/2+(li-(arr.length-1)/2)*11}" fill="#062C60" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="central">${ln}</text>`).join('')}`).join('')}
    <text x="345" y="175" fill="#AF52DE" font-size="8" font-weight="600" font-family="JetBrains Mono" text-anchor="middle" opacity=".6">RECOVERY LOOP</text>
  </svg></div>
  <!-- Facility Balance Table + Loss Analysis -->
  <div class="g2" style="grid-template-columns:2fr 1fr">
    <div class="pd"><div class="st"><div class="dot" style="background:#1A8AD4"></div>Facility-Level Water Balance</div>

// ── NRW Analytics ──
function renderNRW(){const hourly=Array.from({length:24},(_,h)=>{const b=150+R(-20,20);const cr=h<6?.35:.85+R(-.05,.1);return{h:`${String(h).padStart(2,'0')}:00`,i:Math.round(b*10)/10,c:Math.round(b*cr*10)/10,l:Math.round(Math.max(0,b*(1-cr)+R(-2,5))*10)/10}});
  const dmas=[{n:'Main Treatment',k:2.4,a:12,m:'Steel'},{n:'RO & Filtration',k:1.8,a:8,m:'PVC'},{n:'CIP Distribution',k:3.1,a:15,m:'Steel'},{n:'Production Lines',k:4.2,a:10,m:'HDPE'},{n:'Recovery Network',k:2.0,a:6,m:'PVC'},{n:'WWTP & Outflow',k:1.5,a:18,m:'Cast Iron'}].map(d=>{const lp=d.a>10?R(3,25):R(1,12);const iv=R(80,250);return{...d,lp:Math.round(lp*10)/10,iv:Math.round(iv*10)/10,lv:Math.round(iv*lp/100*10)/10,sev:lp>18?'critical':lp>10?'warning':'normal'}});
  const mnf=Array.from({length:24},(_,h)=>({h:`${String(h).padStart(2,'0')}:00`,f:Math.round((h>=1&&h<=4?25+R(-3,3):h>=8&&h<=17?130+R(-15,25):65+R(-10,10))*10)/10}));
  const mnfB=Math.round(Math.min(...mnf.filter(p=>['01:00','02:00','03:00','04:00'].includes(p.h)).map(p=>p.f))*10)/10;
  const tl=dmas.reduce((s,d)=>s+d.lv,0);const mi=Math.round(tl*R(.15,.3)*10)/10;const ua=Math.round(tl*R(.02,.08)*10)/10;const ap=Math.round((mi+ua)*10)/10;const rl=Math.round((tl-ap)*10)/10;

function renderQuality(){
  const prms=[{id:'ph',n:'pH Level',u:'pH',b:7.2,vr:.3,lo:6.5,hi:8.5},{id:'cl',n:'Free Chlorine',u:'mg/L',b:.8,vr:.15,lo:.5,hi:1.2},{id:'ec',n:'Conductivity',u:'uS/cm',b:420,vr:50,lo:200,hi:800},{id:'tb',n:'Turbidity',u:'NTU',b:.4,vr:.2,lo:0,hi:1}].map(p=>{const v=Math.round((p.b+R(-p.vr,p.vr))*100)/100;const ok=v>=p.lo&&v<=p.hi;return{...p,v,ok,st:ok?'normal':'alarm'}});
  const decay=Array.from({length:11},(_,i)=>{const d=i*200;return{d,cl:Math.max(0,Math.round((1+R(-.1,.1))*Math.exp(-.12*d/1000)*1000)/1000)}});
  const zones=[{n:'Pre-Treatment'},{n:'Post-RO'},{n:'Chlorination'},{n:'Nano Filtration'},{n:'Distribution'}].map(z=>{const ph=Math.round((7+R(-.5,.5))*100)/100;const cl=Math.round((.8+R(-.3,.3))*100)/100;const ec=Math.round(400+R(-100,100));const pOk=ph>=6.5&&ph<=8.5,cOk=cl>=.5&&cl<=1.2,eOk=ec>=200&&ec<=800;return{...z,ph,cl,ec,st:(pOk&&cOk&&eOk)?'compliant':'non-compliant'}});
  const evts=Array.from({length:6},(_,i)=>{const ha=RI(1,168);return{t:PK(['pH spike','Chlorine drop','Conductivity anomaly','Turbidity spike']),sev:PK(['critical','warning','info']),z:PK(zones).n,ha,res:ha>24,dur:Math.round(R(.5,12)*10)/10}});
  const preds=prms.map(p=>{const tr=PK(['stable','degrading','improving']);return{n:p.n,v:p.v,tr,br:tr==='degrading'?Math.round(R(12,72)):null,cf:Math.round(R(.7,.95)*100)}});
  const cz=zones.filter(z=>z.st==='compliant').length;const allOk=prms.every(p=>p.ok);const ae=evts.filter(e=>!e.res).length;

  mc.innerHTML+=`<div style="padding:8px;background:#FFFFFF;border-left:2px solid #C9E0EF;border-radius:2px;margin-bottom:8px"><span class="mono" style="font-size:9px;font-weight:700;text-transform:uppercase;color:#163F56;display:block;margin-bottom:4px">USER</span><p class="mono" style="font-size:12px;color:#062C60">${q}</p></div>`;
  const ql=q.toLowerCase();let r;if(ql.includes('flow')||ql.includes('water'))r=AR.flow;else if(ql.includes('chlorine')||ql.includes('compliance'))r=AR.chlorine;else if(ql.includes('anomaly')||ql.includes('leak'))r=AR.anomaly;else if(ql.includes('pressure'))r=AR.pressure;else r=AR.default;

}

  function proj(x,y,z){
    const cx2=x*Math.cos(cam.rotY)+z*Math.sin(cam.rotY),cz=-x*Math.sin(cam.rotY)+z*Math.cos(cam.rotY);
    const cy2=y*Math.cos(cam.rotX)-cz*Math.sin(cam.rotX),cz2=y*Math.sin(cam.rotX)+cz*Math.cos(cam.rotX);
    return[W/2+cx2*SC2*cam.zoom,H/2+(-cy2)*SC2*cam.zoom,cz2];
  }
  function hx(hex,f){const r2=parseInt(hex.slice(1,3),16),g2=parseInt(hex.slice(3,5),16),b2=parseInt(hex.slice(5,7),16);return`rgb(${Math.min(255,Math.round(r2*f))},${Math.min(255,Math.round(g2*f))},${Math.min(255,Math.round(b2*f))})`}
  function face(pts,col,a){ctx.globalAlpha=a||1;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(17,113,184,0.12)';ctx.lineWidth=.5;ctx.stroke();ctx.globalAlpha=1}

  function draw(){
    ctx.clearRect(0,0,W,H);
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#E8F0F8');bg.addColorStop(1,'#D4E6F5');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    // Grid
    ctx.strokeStyle='rgba(17,113,184,0.08)';ctx.lineWidth=.5;
    for(let gx=-18;gx<=24;gx+=2){const[x1,y1]=proj(gx,-.05,-14),[x2,y2]=proj(gx,-.05,16);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
    for(let gz=-14;gz<=16;gz+=2){const[x1,y1]=proj(-18,-.05,gz),[x2,y2]=proj(24,-.05,gz);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
    clk=[];
    // Flows
    flows.forEach(f=>{for(let i=0;i<f.p.length-1;i++){const a=eMap[f.p[i]],b=eMap[f.p[i+1]];if(!a||!b)continue;
      const pA=proj(a.x+a.w/2,a.h*.4,a.z+a.d/2),pB=proj(b.x+b.w/2,b.h*.4,b.z+b.d/2);
      ctx.strokeStyle=f.c;ctx.lineWidth=2;ctx.globalAlpha=flowOn?.8:.5;
      if(flowOn){ctx.setLineDash([6,6]);ctx.lineDashOffset=-flowT*20}else{ctx.setLineDash([])}
      ctx.beginPath();ctx.moveTo(pA[0],pA[1]);ctx.lineTo(pB[0],pB[1]);ctx.stroke();
      if(!flowOn){const mx=(pA[0]+pB[0])/2,my=(pA[1]+pB[1])/2,ang=Math.atan2(pB[1]-pA[1],pB[0]-pA[0]);ctx.globalAlpha=.6;ctx.save();ctx.translate(mx,my);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(-4,-3);ctx.lineTo(4,0);ctx.lineTo(-4,3);ctx.fillStyle=f.c;ctx.fill();ctx.restore()}
      ctx.setLineDash([]);ctx.globalAlpha=1}});
    // Sort + draw
    const sorted=[...eq].sort((a,b)=>{const[,,za]=proj(a.x+a.w/2,0,a.z+a.d/2),[,,zb]=proj(b.x+b.w/2,0,b.z+b.d/2);return zb-za});
    sorted.forEach(e=>{
      const{x,z,w,d,h,col,label,tank,id}=e;
      const b00=proj(x,0,z),b10=proj(x+w,0,z),b11=proj(x+w,0,z+d),b01=proj(x,0,z+d);
      const t00=proj(x,h,z),t10=proj(x+w,h,z),t11=proj(x+w,h,z+d),t01=proj(x,h,z+d);
      face([b00,b10,t10,t00],hx(col,.55));face([b00,b01,t01,t00],hx(col,.75));face([b10,b11,t11,t10],hx(col,.75));face([b01,b11,t11,t01],col);face([t00,t10,t11,t01],hx(col,1.25),.92);
      if(tank){const s=sMap[id],lv=s?Math.min(100,Math.max(0,s.value))/100:.5,wh=h*lv;
        if(wh>.1){const wt=proj(x+.1,wh,z+.1),wt2=proj(x+w-.1,wh,z+.1),wt3=proj(x+w-.1,wh,z+d-.1),wt4=proj(x+.1,wh,z+d-.1);ctx.globalAlpha=.4;ctx.fillStyle='#1171b8';ctx.beginPath();ctx.moveTo(wt[0],wt[1]);ctx.lineTo(wt2[0],wt2[1]);ctx.lineTo(wt3[0],wt3[1]);ctx.lineTo(wt4[0],wt4[1]);ctx.closePath();ctx.fill();ctx.globalAlpha=1}
        const ecx=(t00[0]+t10[0]+t11[0]+t01[0])/4,ecy=(t00[1]+t10[1]+t11[1]+t01[1])/4;
        const rx=Math.abs(t10[0]-t00[0])/2*.7,ry=Math.abs(t10[0]-t11[0])/3*.7+3;
        ctx.fillStyle=hx(col,1.1);ctx.globalAlpha=.5;ctx.beginPath();ctx.ellipse(ecx,ecy,Math.max(1,rx),Math.max(1,ry),0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
        if(s){ctx.font=`bold ${Math.max(8,cam.zoom*9)}px JetBrains Mono,monospace`;ctx.fillStyle='#FFF';ctx.textAlign='center';ctx.fillText(s.value,ecx,ecy+3);ctx.font=`${Math.max(6,cam.zoom*6)}px JetBrains Mono`;ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillText(s.unit||'%',ecx,ecy+12)}
      }
      const lx=(t00[0]+t10[0]+t11[0]+t01[0])/4,ly=Math.min(t00[1],t10[1],t01[1],t11[1])-5;
      const fs=Math.max(7,Math.min(10,SC2*cam.zoom*.32));
      ctx.font=fs+'px sans-serif';ctx.fillStyle='rgba(6,44,96,0.85)';ctx.textAlign='center';
      ctx.fillText(label.length>22?label.slice(0,20)+'…':label,lx,ly);
      const ax=[b00,b10,b11,b01,t00,t10,t11,t01].map(p=>p[0]),ay=[b00,b10,b11,b01,t00,t10,t11,t01].map(p=>p[1]);
      clk.push({id,x:Math.min(...ax)-4,y:Math.min(...ay)-4,w:Math.max(...ax)-Math.min(...ax)+8,h:Math.max(...ay)-Math.min(...ay)+8,label:e.label,desc:e.desc||''});
    });
    // Zone labels
    [{t:'OUTSIDE HMI',x:-10,z:-12,c:'#4a9'},{t:'SIEMENS / RO',x:8,z:-1,c:'#ca4'},{t:'NANO FILTRATION',x:-3,z:5,c:'#8a5fc0'},{t:'DISTRIBUTION',x:16,z:0,c:'#4af'},{t:'WWTP / RECOVERY',x:15,z:11,c:'#2aaa8a'}].forEach(l=>{const[sx,sy]=proj(l.x,6,l.z);ctx.font='11px sans-serif';ctx.fillStyle=l.c;ctx.globalAlpha=.45;ctx.textAlign='center';ctx.fillText(l.t,sx,sy);ctx.globalAlpha=1});
  }

  // View mode buttons
  window.plantSetView=function(v){
    document.querySelectorAll('#plantUI button').forEach(b=>{b.style.background='rgba(17,113,184,0.1)';b.style.borderColor='rgba(255,255,255,.2)'});
    const btn=document.getElementById('pv-'+v);if(btn){btn.style.background='rgba(100,180,255,.25)';btn.style.borderColor='rgba(100,180,255,.6)'}
    if(v==='iso'){cam.rotX=.52;cam.rotY=.6;cam.zoom=1}
    else if(v==='top'){cam.rotX=Math.PI/2;cam.rotY=0;cam.zoom=.9}
    else if(v==='front'){cam.rotX=.1;cam.rotY=0;cam.zoom=.9}
    draw();
  };
  window.plantResetCam=function(){cam={rotX:.52,rotY:.6,zoom:1};draw()};
  window.plantToggleFlow=function(){
    flowOn=!flowOn;document.getElementById('plantFlowBtn').textContent=flowOn?'Stop ■':'Animate ▶';
    if(flowOn){(function anim(){flowT+=.018;draw();animId=requestAnimationFrame(anim)})()}
    else{cancelAnimationFrame(animId);draw()}
  };
  window.plantDrillDown=function(){if(selectedId&&knownSensors.includes(selectedId))openAnalytics(selectedId)};

  // Mouse interaction: drag to orbit
  let drag=false,lastX,lastY;
  cv.addEventListener('mousedown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;cv.style.cursor='grabbing'});
  cv.addEventListener('mousemove',e=>{if(!drag)return;cam.rotY+=(e.clientX-lastX)*.008;cam.rotX=Math.max(-.1,Math.min(Math.PI/2,cam.rotX+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY;if(!flowOn)draw()});
  cv.addEventListener('mouseup',()=>{drag=false;cv.style.cursor='grab'});
  cv.addEventListener('mouseleave',()=>{drag=false;cv.style.cursor='grab'});
  cv.addEventListener('wheel',e=>{e.preventDefault();cam.zoom*=e.deltaY>0?.93:1.07;cam.zoom=Math.max(.25,Math.min(3.5,cam.zoom));if(!flowOn)draw()},{passive:false});
  // Touch support
  let lastTD=0;
  cv.addEventListener('touchstart',e=>{if(e.touches.length===1){drag=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY}if(e.touches.length===2){drag=false;lastTD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}});
  cv.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1&&drag){cam.rotY+=(e.touches[0].clientX-lastX)*.01;cam.rotX=Math.max(-.1,Math.min(Math.PI/2,cam.rotX+(e.touches[0].clientY-lastY)*.008));lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;if(!flowOn)draw()}if(e.touches.length===2){const d2=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);cam.zoom*=d2/lastTD;lastTD=d2;cam.zoom=Math.max(.25,Math.min(3.5,cam.zoom));if(!flowOn)draw()}},{passive:false});
  cv.addEventListener('touchend',()=>{drag=false});
  // Click: show info + analytics link
  cv.addEventListener('click',e=>{
    const rect=cv.getBoundingClientRect(),mx=(e.clientX-rect.left)*dpr,my=(e.clientY-rect.top)*dpr;
    let hit=null;for(const c of clk){if(mx>=c.x&&mx<=c.x+c.w&&my>=c.y&&my<=c.y+c.h){hit=c;break}}
    const info=document.getElementById('plantInfo'),title=document.getElementById('plantInfoTitle'),desc=document.getElementById('plantInfoDesc'),sLink=document.getElementById('plantInfoSensor');
    if(hit){
      selectedId=hit.id;title.textContent=hit.label;desc.textContent=hit.desc;
      if(knownSensors.includes(hit.id)){sLink.style.display='block';sLink.textContent='→ View Analytics ('+hit.id+')'}else{sLink.style.display='none'}
      info.style.display='block';
    }else{info.style.display='none';selectedId=null}
  });

  window.addEventListener('resize',()=>{resize();draw()});
  draw();
}

// ── Tab System ──
const TABS=[{id:'pfd',l:'Process Flow',r:renderPFD},{id:'plant',l:'Plant Overview',r:renderPlant},{id:'balance',l:'Water Balance',r:renderWB},{id:'nrw',l:'NRW Analytics',r:renderNRW},{id:'demand',l:'Demand',r:renderDemand},{id:'assets',l:'Asset Health',r:renderAssets},{id:'quality',l:'Water Quality',r:renderQuality}];
let activeTab='pfd';
function switchTab(id){activeTab=id;document.querySelectorAll('.tv').forEach(v=>v.classList.remove('ac'));document.getElementById(`view-${id}`).classList.add('ac');document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('ac',b.dataset.tab===id));TABS.find(t=>t.id===id)?.r()}
function buildTabs(){document.getElementById('mainTabs').innerHTML=TABS.map(t=>`<button class="tb${t.id===activeTab?' ac':''}" data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.l}</button>`).join('')}

// ── Init ──
function init(){renderMetrics();buildTabs();renderPFD();renderSensorGrid();renderAnomalies();renderAlerts();renderCompliance();renderAI();setInterval(()=>{sensors=genSensors();alerts=genAlerts();anomalies=genAnomalies();renderMetrics();if(activeTab==='pfd')renderPFD();renderSensorGrid();renderAnomalies();renderAlerts()},8000)}
window.addEventListener('DOMContentLoaded',init);
</script>
