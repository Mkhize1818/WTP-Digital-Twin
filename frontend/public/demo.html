<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Twin - Water Reticulation System</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0A0A0A;
  --bg-secondary: #121212;
  --bg-card: #1A1A1A;
  --bg-inset: #0D0D0D;
  --border: rgba(255,255,255,0.08);
  --border-light: rgba(255,255,255,0.1);
  --text-primary: #FFFFFF;
  --text-secondary: #A3A3A3;
  --text-muted: #525252;
  --blue: #007AFF;
  --green: #34C759;
  --red: #FF3B30;
  --orange: #FF9500;
  --purple: #AF52DE;
  --cyan: #32ADE6;
  --yellow: #FFD60A;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'IBM Plex Sans',sans-serif; background:var(--bg-primary); color:var(--text-primary); min-height:100vh; }
.font-chivo { font-family:'Chivo',sans-serif; }
.font-mono { font-family:'JetBrains Mono',monospace; }

/* Header */
.header { display:flex; align-items:center; justify-content:space-between; padding:12px 32px; border-bottom:1px solid var(--border); background:var(--bg-primary); position:sticky; top:0; z-index:50; }
.header-left { display:flex; align-items:center; gap:12px; }
.header-center { text-align:center; }
.header-center h1 { font-family:'Chivo',sans-serif; font-size:22px; font-weight:900; letter-spacing:-0.5px; }
.header-center p { font-size:11px; color:var(--text-secondary); letter-spacing:1px; text-transform:uppercase; }
.logo-box { padding:6px 12px; border:2px solid var(--blue); font-family:'Chivo',sans-serif; font-weight:900; font-size:18px; }
.live-dot { width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.coke-logo { height:40px; }

/* Layout */
.main { padding:24px 32px; }
.grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
.grid-6 { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:24px; }
.grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px; }
.grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-bottom:16px; }
.grid-main { display:grid; grid-template-columns:3fr 1fr; gap:16px; }

/* Metric Cards */
.metric-card { background:var(--bg-card); border:1px solid var(--border); padding:20px 24px; }
.metric-card .label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:2px; color:var(--text-secondary); margin-bottom:8px; }
.metric-card .value { font-family:'Chivo',sans-serif; font-size:42px; font-weight:900; letter-spacing:-2px; line-height:1; }
.metric-card .unit { font-size:14px; color:var(--text-muted); font-weight:400; margin-left:4px; }

/* Tabs */
.tabs { display:flex; align-items:center; border:1px solid var(--border-light); background:var(--bg-card); border-radius:2px; overflow:hidden; }
.tab-btn { display:flex; align-items:center; gap:4px; padding:8px 12px; font-size:10px; font-weight:700; border:none; cursor:pointer; transition:all 0.2s; background:transparent; color:var(--text-secondary); }
.tab-btn.active { background:var(--blue); color:#fff; }
.tab-btn:hover:not(.active) { color:#fff; }
.tab-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }

/* Panel */
.panel { background:var(--bg-secondary); border:1px solid var(--border); padding:20px 24px; margin-bottom:16px; }
.panel-dark { background:var(--bg-inset); border:1px solid var(--border); padding:16px 20px; border-radius:2px; margin-bottom:16px; }
.section-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:2px; color:var(--text-secondary); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.section-title .dot { width:6px; height:6px; border-radius:50%; }

/* Balance Cards */
.balance-card { padding:12px; border-radius:2px; border:1px solid; background:var(--bg-card); }
.balance-card .bc-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:var(--text-secondary); margin-bottom:6px; }
.balance-card .bc-value { font-family:'Chivo',sans-serif; font-size:24px; font-weight:900; letter-spacing:-1px; }
.balance-card .bc-unit { font-size:10px; color:var(--text-muted); }
.balance-card .bc-sub { font-size:9px; color:var(--text-muted); margin-top:4px; }

/* Flow Diagram */
.flow-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:20px; padding:0 20px; overflow-x:auto; }
.flow-node { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px 16px; border-radius:2px; border:1px solid; min-width:110px; text-align:center; }
.flow-node .fn-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-secondary); margin-bottom:4px; }
.flow-node .fn-value { font-family:'Chivo',sans-serif; font-size:20px; font-weight:900; letter-spacing:-1px; }
.flow-node .fn-unit { font-size:9px; color:var(--text-muted); }
.flow-arrow { display:flex; align-items:center; color:var(--text-muted); font-size:18px; }

/* Distribution Items */
.dist-item { display:flex; align-items:center; justify-content:between; padding:6px 8px; background:var(--bg-primary); border-radius:2px; margin-bottom:4px; }
.dist-item .di-label { font-size:10px; color:var(--text-secondary); flex:1; }
.dist-item .di-value { font-size:11px; font-weight:700; font-family:'JetBrains Mono',monospace; }

/* Efficiency Gauge */
.gauge-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
.gauge-item .gi-header { display:flex; justify-content:space-between; margin-bottom:4px; }
.gauge-item .gi-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-secondary); }
.gauge-item .gi-value { font-size:11px; font-weight:700; font-family:'JetBrains Mono',monospace; }
.gauge-bar { height:6px; background:#252525; border-radius:3px; overflow:hidden; }
.gauge-fill { height:100%; border-radius:3px; transition:width 0.7s ease; }

/* Alert Banner */
.alert-banner { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:2px; border:1px solid; margin-bottom:8px; font-size:11px; }

/* Table */
.data-table { width:100%; font-size:10px; border-collapse:collapse; }
.data-table th { text-align:left; padding:8px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid var(--border); }
.data-table td { padding:8px; border-bottom:1px solid rgba(255,255,255,0.03); }
.data-table .name { font-weight:700; color:#fff; }
.data-table .sub { font-size:9px; color:var(--text-muted); }
.badge { padding:2px 6px; border-radius:2px; font-size:9px; font-weight:700; text-transform:uppercase; }

/* Chart container */
.chart-container { position:relative; width:100%; }

/* Heatmap */
.heatmap { display:flex; flex-direction:column; gap:2px; }
.heatmap-row { display:flex; align-items:center; gap:2px; }
.heatmap-label { width:28px; font-size:8px; color:var(--text-secondary); }
.heatmap-cell { width:16px; height:14px; border-radius:1px; }

/* Leak badge */
.leak-badge { display:flex; align-items:center; gap:6px; padding:4px 8px; border:1px solid var(--red); border-radius:2px; animation:pulse 2s infinite; }
.leak-badge span { font-size:11px; font-weight:700; color:var(--red); }

/* Quality cards */
.quality-card { padding:12px; border-radius:2px; border:1px solid; background:var(--bg-card); }
.quality-card .range-bar { position:relative; height:6px; background:#252525; border-radius:3px; margin-top:8px; }
.quality-card .range-ok { position:absolute; height:100%; background:rgba(52,199,89,0.2); border-radius:3px; }
.quality-card .range-dot { position:absolute; width:8px; height:8px; border-radius:50%; top:-1px; transform:translateX(-50%); }

/* Zone card */
.zone-card { padding:10px; border-radius:2px; border:1px solid; background:var(--bg-secondary); margin-bottom:8px; }
.zone-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; font-size:10px; }

/* Event log */
.event-item { display:flex; align-items:flex-start; gap:8px; padding:8px; background:var(--bg-secondary); border-radius:2px; margin-bottom:4px; }
.event-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; margin-top:5px; }

/* Prediction card */
.pred-card { padding:10px; background:var(--bg-secondary); border-radius:2px; margin-bottom:8px; }

/* PFD placeholder */
.pfd-placeholder { position:relative; width:100%; min-height:450px; background:var(--bg-inset); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden; }
.pfd-placeholder img { width:100%; height:auto; opacity:0.9; filter:brightness(0.9); }

/* AI Panel */
.ai-panel { background:var(--bg-primary); border:1px solid rgba(0,122,255,0.5); padding:20px; min-height:500px; max-height:500px; display:flex; flex-direction:column; }
.ai-panel h3 { font-family:'Chivo',sans-serif; font-size:18px; font-weight:700; margin-bottom:4px; }
.ai-panel .subtitle { font-size:11px; color:var(--text-secondary); margin-bottom:16px; }
.suggested-q { width:100%; text-align:left; font-size:11px; padding:8px; border:1px solid var(--border-light); background:var(--bg-secondary); color:var(--text-secondary); cursor:pointer; margin-bottom:6px; border-radius:2px; }
.suggested-q:hover { border-color:var(--blue); }
.ai-input-row { display:flex; gap:8px; margin-top:auto; }
.ai-input-row input { flex:1; padding:8px 12px; font-size:12px; border:1px solid var(--border-light); background:var(--bg-secondary); color:#fff; font-family:'JetBrains Mono',monospace; border-radius:2px; outline:none; }
.ai-input-row input:focus { border-color:var(--blue); }
.ai-input-row button { padding:8px 16px; background:var(--blue); color:#fff; border:none; cursor:pointer; border-radius:2px; font-weight:700; }

/* Maintenance item */
.maint-item { padding:10px; border-radius:2px; border:1px solid; background:var(--bg-secondary); margin-bottom:8px; }

/* Status banner */
.status-banner { display:flex; align-items:center; justify-content:space-between; padding:12px; border-radius:2px; border:1px solid; margin-bottom:16px; }

/* Scrollbar */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:var(--bg-primary); }
::-webkit-scrollbar-thumb { background:#333; border-radius:2px; }

/* Responsive */
@media (max-width:1024px) {
  .grid-4,.grid-6,.gauge-row { grid-template-columns:repeat(2,1fr); }
  .grid-main { grid-template-columns:1fr; }
  .grid-3 { grid-template-columns:1fr; }
  .grid-2 { grid-template-columns:1fr; }
  .flow-row { flex-wrap:wrap; justify-content:center; }
}
@media (max-width:640px) {
  .main { padding:12px 16px; }
  .header { padding:8px 16px; }
  .grid-4,.grid-6,.gauge-row { grid-template-columns:1fr; }
  .metric-card .value { font-size:28px; }
}

.tab-view { display:none; }
.tab-view.active { display:block; }
.hidden { display:none; }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <div class="logo-box">TALBOT<sub style="font-size:10px;color:var(--blue)">&#9662;</sub></div>
    <div style="display:flex;align-items:center;gap:6px"><div class="live-dot"></div><span style="font-size:11px;color:var(--green)">Live</span></div>
  </div>
  <div class="header-center">
    <h1 class="font-chivo">Digital Twin</h1>
    <p>Water Reticulation System</p>
  </div>
  <div>
    <img src="https://customer-assets.emergentagent.com/job_08778319-680e-4dcc-9637-79a56dea1c9a/artifacts/3tfcfqun_CCBA_CocaCola_logo.png" alt="Coca-Cola" class="coke-logo" onerror="this.style.display='none'">
  </div>
</header>

<main class="main">
  <!-- Top Metrics -->
  <div class="grid-4" id="metricsRow"></div>

  <!-- Main Content -->
  <div class="grid-main">
    <!-- Left: Tabs -->
    <div>
      <div class="panel" style="padding:16px 20px">
        <div class="tab-header">
          <div class="tabs" id="mainTabs"></div>
          <div class="leak-badge" id="leakBadge">
            <span>&#9679;</span><span>6 LEAKS DETECTED</span>
          </div>
        </div>

        <!-- Tab Views -->
        <div id="view-pfd" class="tab-view active"></div>
        <div id="view-balance" class="tab-view"></div>
        <div id="view-nrw" class="tab-view"></div>
        <div id="view-demand" class="tab-view"></div>
        <div id="view-assets" class="tab-view"></div>
        <div id="view-quality" class="tab-view"></div>
      </div>
    </div>

    <!-- Right: AI Panel -->
    <div>
      <div class="ai-panel">
        <h3 class="font-chivo">AI Agent</h3>
        <p class="subtitle">Ask questions about the system</p>
        <div style="flex:1;overflow-y:auto;margin-bottom:12px" id="aiMessages">
          <p style="font-size:11px;color:var(--text-secondary);margin-bottom:8px">Try asking:</p>
          <button class="suggested-q" onclick="askAI(this.textContent)">How much water has passed through today?</button>
          <button class="suggested-q" onclick="askAI(this.textContent)">Show me chlorine compliance status</button>
          <button class="suggested-q" onclick="askAI(this.textContent)">When was the last anomaly detected?</button>
          <button class="suggested-q" onclick="askAI(this.textContent)">What's the average pressure?</button>
        </div>
        <div class="ai-input-row">
          <input type="text" placeholder="Ask me anything..." id="aiInput" onkeydown="if(event.key==='Enter')askAI()">
          <button onclick="askAI()">&#9654;</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
// ── Utility Functions ──────────────────────────────
const rand = (min,max) => Math.round((Math.random()*(max-min)+min)*100)/100;
const randInt = (min,max) => Math.floor(Math.random()*(max-min+1))+min;
const pick = arr => arr[randInt(0,arr.length-1)];
const clamp = (v,lo,hi) => Math.min(hi,Math.max(lo,v));

// ── Simulated Data Generators ──────────────────────
function genMetrics() {
  return [
    {label:'Total Flow', value:rand(450,550).toFixed(2), unit:'L/min', icon:'&#9679;'},
    {label:'Avg Pressure', value:rand(2.0,3.0).toFixed(2), unit:'bar', icon:'&#9678;'},
    {label:'Active Alerts', value:randInt(1200,2200), unit:'', icon:'&#9888;', severity:true},
    {label:'Sensors Online', value:`${randInt(24,27)}/27`, unit:'', icon:'&#9737;'},
  ];
}

function genWaterBalance() {
  const municipal = rand(140,170);
  const treatLoss = round2(municipal * rand(0.04,0.06));
  const treated = round2(municipal - treatLoss);
  const cip = round2(treated*0.28);
  const pet = round2(treated*0.20);
  const can = round2(treated*0.13);
  const syrup = round2(treated*0.09);
  const production = round2(cip+pet+can+syrup);
  const nano1 = rand(60,90);
  const nano2 = rand(50,80);
  const backwash = rand(20,40);
  const recovery = round2(nano1+nano2+backwash);
  const wastewater = round2(treated*rand(0.16,0.20));
  const leakLoss = rand(5,25);
  const unaccounted = round2(Math.max(0, municipal - production - wastewater - treatLoss));
  const totalLoss = round2(treatLoss + unaccounted + leakLoss);
  const efficiency = round2(100 - (totalLoss/municipal)*100);
  const waterUse = round2((production/municipal)*100);
  const recoveryRate = round2((recovery/(municipal+recovery))*100);
  const lossRate = round2((totalLoss/municipal)*100);
  return {municipal,treated,treatLoss,cip,pet,can,syrup,production,nano1,nano2,backwash,recovery,wastewater,leakLoss,unaccounted,totalLoss,efficiency,waterUse,recoveryRate,lossRate,treatLossPct:round2(treatLoss/municipal*100)};
}

function genNRW() {
  const hourly = Array.from({length:24},(_,h)=>{
    const base = 150+rand(-20,20);
    const cr = h<6?0.35:(0.85+rand(-0.05,0.1));
    return {hour:`${String(h).padStart(2,'0')}:00`,input:round2(base),consumption:round2(base*cr),losses:round2(Math.max(0,base*(1-cr)+rand(-2,5)))};
  });
  const dmas = [
    {id:'DMA_01',name:'Main Treatment',pipeKm:2.4,age:12,material:'Steel'},
    {id:'DMA_02',name:'RO & Filtration',pipeKm:1.8,age:8,material:'PVC'},
    {id:'DMA_03',name:'CIP Distribution',pipeKm:3.1,age:15,material:'Steel'},
    {id:'DMA_04',name:'Production Lines',pipeKm:4.2,age:10,material:'HDPE'},
    {id:'DMA_05',name:'Recovery Network',pipeKm:2.0,age:6,material:'PVC'},
    {id:'DMA_06',name:'WWTP & Outflow',pipeKm:1.5,age:18,material:'Cast Iron'},
  ].map(d=>{
    const lp=d.age>10?rand(3,25):rand(1,12);
    const iv=rand(80,250);
    return {...d,lossPct:round2(lp),inputVol:round2(iv),lossVol:round2(iv*lp/100),severity:lp>18?'critical':lp>10?'warning':'normal'};
  });
  const mnf = Array.from({length:24},(_,h)=>{
    let flow;
    if(h>=1&&h<=4) flow=25+rand(-3,3);
    else if(h>=8&&h<=17) flow=130+rand(-15,25);
    else flow=65+rand(-10,10);
    return {hour:`${String(h).padStart(2,'0')}:00`,flow:round2(flow)};
  });
  const mnfBase = round2(Math.min(...mnf.filter(p=>['01:00','02:00','03:00','04:00'].includes(p.hour)).map(p=>p.flow)));
  const totalLoss = dmas.reduce((s,d)=>s+d.lossVol,0);
  const meterInac = round2(totalLoss*rand(0.15,0.30));
  const unauthorized = round2(totalLoss*rand(0.02,0.08));
  const apparent = round2(meterInac+unauthorized);
  const real = round2(totalLoss-apparent);
  const pipes = [
    {id:'PS_01',name:'Main Feed Header',material:'Steel',diameter:200,age:12,prob:0},
    {id:'PS_02',name:'RO Feed Pipe',material:'PVC',diameter:150,age:8,prob:0},
    {id:'PS_03',name:'CIP Supply Main',material:'Steel',diameter:100,age:15,prob:0},
    {id:'PS_04',name:'PET Line Header',material:'HDPE',diameter:150,age:10,prob:0},
    {id:'PS_05',name:'Canline Supply',material:'HDPE',diameter:100,age:10,prob:0},
    {id:'PS_06',name:'Syrup Room Feed',material:'HDPE',diameter:80,age:10,prob:0},
    {id:'PS_07',name:'Nano Recovery Main',material:'PVC',diameter:100,age:6,prob:0},
    {id:'PS_08',name:'Backwash Return',material:'PVC',diameter:80,age:6,prob:0},
    {id:'PS_09',name:'WWTP Outfall',material:'Cast Iron',diameter:200,age:18,prob:0},
    {id:'PS_10',name:'Fire Line Branch',material:'Steel',diameter:150,age:14,prob:0},
  ].map(p=>{
    const mf={Cast_Iron:0.9,Steel:0.6,PVC:0.3,HDPE:0.2}[p.material.replace(' ','_')]||0.4;
    const prob=clamp(Math.min(p.age/20,1)*0.4+mf*0.35+rand(-0.05,0.1),0.01,0.95);
    return {...p,prob:round2(prob),risk:prob>0.6?'high':prob>0.35?'medium':'low'};
  }).sort((a,b)=>b.prob-a.prob);
  const flags=dmas.filter(d=>d.lossPct>15).map(d=>({zone:d.name,msg:`Loss rate ${d.lossPct}% exceeds threshold`,severity:d.lossPct>20?'critical':'warning'}));
  if(mnfBase>35) flags.push({zone:'System',msg:`MNF baseline ${mnfBase} L/min suggests background leakage`,severity:'warning'});
  return {hourly,dmas,mnf,mnfBase,apparent,real,meterInac,unauthorized,totalLoss:round2(totalLoss),pipeLeaks:round2(real*0.7),overflow:round2(real*0.3),pipes,flags};
}

function genDemand() {
  const forecast = Array.from({length:24},(_,h)=>{
    let base;
    if(h>=1&&h<=5) base=40+rand(-5,5);
    else if(h>=8&&h<=17) base=145+rand(-15,20);
    else base=75+rand(-10,10);
    return {hour:`${String(h).padStart(2,'0')}:00`,actual:round2(base+rand(-8,8)),predicted:round2(base),lower:round2(base*0.85),upper:round2(base*1.15)};
  });
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const heatmap=[];
  days.forEach((day,di)=>{
    for(let h=0;h<24;h++){
      let val;
      if(h>=1&&h<=5) val=30+rand(-5,10);
      else if(h>=8&&h<=17) val=di<5?140+rand(-20,25):80+rand(-10,15);
      else val=65+rand(-10,15);
      heatmap.push({day,hour:h,value:round2(val)});
    }
  });
  const avgD = forecast.reduce((s,f)=>s+f.actual,0)/forecast.length;
  const segments=[
    {name:'CIP Lines',pct:round2(38+rand(-3,3)),color:'#007AFF'},
    {name:'PET Lines',pct:round2(28+rand(-2,2)),color:'#34C759'},
    {name:'Canline',pct:round2(18+rand(-2,2)),color:'#FF9500'},
    {name:'Syrup Room',pct:round2(10+rand(-1,1)),color:'#AF52DE'},
    {name:'Utilities',pct:round2(6+rand(-1,1)),color:'#32ADE6'},
  ];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const seasonal=months.map((m,i)=>{
    const sf=[0,1,11].includes(i)?1.2:[5,6,7].includes(i)?0.9:1.0;
    return {month:m,avg:round2(120*sf+rand(-10,10)),peak:round2(180*sf+rand(-15,15)),temp:round2(25*sf+rand(-3,3))};
  });
  return {forecast,heatmap,days,segments,seasonal,summary:{current:round2(avgD),peak:round2(Math.max(...forecast.map(f=>f.predicted))),avg:round2(avgD)}};
}

function genAssetHealth() {
  const assets=[
    {id:'PS_01',name:'Main Feed Header',material:'Steel',length:450,diameter:200,age:12},
    {id:'PS_02',name:'RO Feed Pipe',material:'PVC',length:280,diameter:150,age:8},
    {id:'PS_03',name:'CIP Supply Main',material:'Steel',length:620,diameter:100,age:15},
    {id:'PS_04',name:'PET Line Header',material:'HDPE',length:350,diameter:150,age:10},
    {id:'PS_05',name:'Canline Supply',material:'HDPE',length:300,diameter:100,age:10},
    {id:'PS_06',name:'Syrup Room Feed',material:'HDPE',length:180,diameter:80,age:10},
    {id:'PS_07',name:'Nano Recovery Main',material:'PVC',length:400,diameter:100,age:6},
    {id:'PS_08',name:'Backwash Return',material:'PVC',length:250,diameter:80,age:6},
    {id:'PS_09',name:'WWTP Outfall',material:'Cast Iron',length:380,diameter:200,age:18},
    {id:'PS_10',name:'Fire Line Branch',material:'Steel',length:520,diameter:150,age:14},
  ].map(a=>{
    const matBonus={HDPE:15,PVC:10,Steel:-5,'Cast Iron':-15}[a.material]||0;
    const score=clamp(Math.max(0,100-a.age*4)+matBonus-rand(0,15)+rand(-5,5),0,100);
    const baseLife={HDPE:50,PVC:40,Steel:30,'Cast Iron':25}[a.material]||30;
    const rul=Math.max(0,baseLife-a.age+rand(-3,3));
    const fp=clamp((1-score/100)*0.8+rand(-0.05,0.05),0.01,0.95);
    const grade=score>=80?'A':score>=60?'B':score>=40?'C':'D';
    return {...a,score:round2(score),grade,rul:round2(rul),fp:round2(fp),risk:fp>0.5?'high':fp>0.25?'medium':'low'};
  }).sort((a,b)=>b.fp-a.fp);
  const breaks=Array.from({length:12},(_,m)=>{
    const d=new Date();d.setMonth(d.getMonth()-11+m);
    const cnt=[0,1,2,3][randInt(0,3)];
    return {month:d.toLocaleDateString('en',{month:'short',year:'2-digit'}),breaks:cnt,cost:cnt>0?Math.round(cnt*rand(5000,25000)):0};
  });
  const maint=assets.slice(0,5).map(a=>({
    id:a.id,name:a.name,type:a.fp>0.5?'urgent':'preventive',
    date:new Date(Date.now()+randInt(7,90)*86400000).toISOString().slice(0,10),
    priority:a.fp>0.5?'high':'medium',cost:Math.round(rand(3000,50000)),
  }));
  const avgScore=round2(assets.reduce((s,a)=>s+a.score,0)/assets.length);
  const highRisk=assets.filter(a=>a.risk==='high').length;
  return {assets,breaks,maint,summary:{avgScore,highRisk,total:assets.length,avgRul:round2(assets.reduce((s,a)=>s+a.rul,0)/assets.length),totalBreaks:breaks.reduce((s,b)=>s+b.breaks,0)}};
}

function genWaterQuality() {
  const params=[
    {id:'ph',name:'pH Level',unit:'pH',base:7.2,var:0.3,lo:6.5,hi:8.5},
    {id:'chlorine',name:'Free Chlorine',unit:'mg/L',base:0.8,var:0.15,lo:0.5,hi:1.2},
    {id:'conductivity',name:'Conductivity',unit:'uS/cm',base:420,var:50,lo:200,hi:800},
    {id:'turbidity',name:'Turbidity',unit:'NTU',base:0.4,var:0.2,lo:0,hi:1.0},
  ].map(p=>{
    const val=round2(p.base+rand(-p.var,p.var));
    const inSpec=val>=p.lo&&val<=p.hi;
    return {...p,value:val,inSpec,status:inSpec?'normal':'alarm'};
  });
  const decay=Array.from({length:11},(_,i)=>{
    const dist=i*200;
    const cl=round2((1.0+rand(-0.1,0.1))*Math.exp(-0.12*dist/1000));
    return {distance:dist,chlorine:Math.max(0,cl),minReq:0.2};
  });
  const zones=[
    {id:'QZ_01',name:'Pre-Treatment'},{id:'QZ_02',name:'Post-RO'},{id:'QZ_03',name:'Chlorination'},
    {id:'QZ_04',name:'Nano Filtration'},{id:'QZ_05',name:'Distribution'},
  ].map(z=>{
    const ph=round2(7+rand(-0.5,0.5));
    const cl=round2(0.8+rand(-0.3,0.3));
    const ec=Math.round(400+rand(-100,100));
    const phOk=ph>=6.5&&ph<=8.5,clOk=cl>=0.5&&cl<=1.2,ecOk=ec>=200&&ec<=800;
    return {...z,ph,cl,ec,status:(phOk&&clOk&&ecOk)?'compliant':'non-compliant',ok:+phOk+ +clOk+ +ecOk};
  });
  const evtTypes=['pH spike','Chlorine drop','Conductivity anomaly','Turbidity spike'];
  const sevs=['critical','warning','info'];
  const events=Array.from({length:6},(_,i)=>{
    const hAgo=randInt(1,168);
    return {id:`CE_${String(i+1).padStart(3,'0')}`,type:pick(evtTypes),severity:pick(sevs),zone:pick(zones).name,hoursAgo:hAgo,resolved:hAgo>24,duration:round2(rand(0.5,12))};
  });
  const predictions=params.map(p=>{
    const trend=pick(['stable','degrading','improving']);
    return {param:p.name,value:p.value,trend,breach:trend==='degrading'?Math.round(rand(12,72)):null,conf:round2(rand(0.7,0.95))};
  });
  const compliantZones=zones.filter(z=>z.status==='compliant').length;
  return {params,decay,zones,events,predictions,summary:{status:params.every(p=>p.inSpec)?'compliant':'non-compliant',compliantZones,totalZones:zones.length,activeEvents:events.filter(e=>!e.resolved).length,inSpec:params.filter(p=>p.inSpec).length,totalParams:params.length}};
}

function round2(v){return Math.round(v*100)/100;}

// ── Tab System ─────────────────────────────────────
const TAB_CONFIG = [
  {id:'pfd',label:'Process Flow',icon:'&#8853;',render:renderPFD},
  {id:'balance',label:'Water Balance',icon:'&#9878;',render:renderWaterBalance},
  {id:'nrw',label:'NRW Analytics',icon:'&#9679;',render:renderNRW},
  {id:'demand',label:'Demand',icon:'&#8599;',render:renderDemand},
  {id:'assets',label:'Asset Health',icon:'&#9829;',render:renderAssetHealth},
  {id:'quality',label:'Water Quality',icon:'&#9874;',render:renderWaterQuality},
];

let activeTab = 'pfd';

function switchTab(id) {
  activeTab = id;
  document.querySelectorAll('.tab-view').forEach(v=>v.classList.remove('active'));
  document.getElementById(`view-${id}`).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===id);
  });
  const cfg = TAB_CONFIG.find(t=>t.id===id);
  if(cfg) cfg.render();
}

function buildTabs() {
  document.getElementById('mainTabs').innerHTML = TAB_CONFIG.map(t=>`
    <button class="tab-btn ${t.id===activeTab?'active':''}" data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.icon} ${t.label}</button>
  `).join('');
}

// ── AI Chat ────────────────────────────────────────
const AI_RESPONSES = {
  'flow': 'Total water flow through the system is currently averaging 496.4 L/min across all 5 flow instruments (FIT_10, FIT_CIP, FIT_FL, FIT_6, FIT_8). Peak flow today was recorded at 14:23 at 534.2 L/min on the main municipal intake line.',
  'chlorine': 'Free chlorine levels are currently at 0.82 mg/L (CL_001), within the compliant range of 0.5–1.2 mg/L. Chlorine decay modelling shows levels remain above the 0.2 mg/L minimum requirement across all distribution points up to 1800m from the dosing point.',
  'anomaly': 'The last anomaly was detected 47 minutes ago on DMA_03 (CIP Distribution) — a flow pattern deviation suggesting a possible minor leak. Confidence score: 78%. The AI leak probability model assigns a 62% chance to pipe segment PS_03 (CIP Supply Main, Steel, 15yr old).',
  'pressure': 'Average system pressure is currently 2.41 bar. Pressure indicators PIT_01 through PIT_05 show stable readings. PIT_03 (Nano membrane feed) is at 3.2 bar — highest in the system. No pressure anomalies detected in the last 24 hours.',
  'default': 'Based on current system telemetry: 26/27 instruments are online, system efficiency is at 87.5%, and water use ratio is 70.2%. There are 2 active compliance alerts related to elevated loss rates in DMA_01 and DMA_03. Would you like me to drill down into any specific area?',
};

function askAI(presetQuery) {
  const input = document.getElementById('aiInput');
  const msgContainer = document.getElementById('aiMessages');
  const query = presetQuery || input.value.trim();
  if(!query) return;
  input.value = '';

  // Remove suggested queries
  msgContainer.querySelectorAll('.suggested-q').forEach(e=>e.remove());
  const pTag = msgContainer.querySelector('p');
  if(pTag) pTag.remove();

  // Add user message
  msgContainer.innerHTML += `<div style="padding:8px;background:#1A1A1A;border-left:2px solid #A3A3A3;border-radius:2px;margin-bottom:8px"><span class="font-mono" style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#A3A3A3;display:block;margin-bottom:4px">USER</span><p style="font-size:12px;color:#fff;font-family:'JetBrains Mono',monospace">${query}</p></div>`;

  // Determine response
  const q = query.toLowerCase();
  let response;
  if(q.includes('flow')||q.includes('water')) response = AI_RESPONSES.flow;
  else if(q.includes('chlorine')||q.includes('compliance')) response = AI_RESPONSES.chlorine;
  else if(q.includes('anomaly')||q.includes('leak')||q.includes('detect')) response = AI_RESPONSES.anomaly;
  else if(q.includes('pressure')) response = AI_RESPONSES.pressure;
  else response = AI_RESPONSES.default;

  setTimeout(()=>{
    msgContainer.innerHTML += `<div style="padding:8px;background:#121212;border-left:2px solid #007AFF;border-radius:2px;margin-bottom:8px"><span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#007AFF;display:block;margin-bottom:4px">ASSISTANT</span><p style="font-size:12px;color:#fff;line-height:1.6">${response}</p></div>`;
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }, 800);
}

// ── Initialize ─────────────────────────────────────
function init() {
  renderMetrics();
  buildTabs();
  renderPFD();

  // Refresh metrics every 5s
  setInterval(renderMetrics, 5000);
}

window.addEventListener('DOMContentLoaded', init);
</script>
